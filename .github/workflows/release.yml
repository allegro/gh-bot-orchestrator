name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: echo "VERSION=$(./gradlew currentVersion -q -Prelease.quiet)" >> "$GITHUB_ENV"

      - run: ./gradlew bootBuildImage --publishImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: helm package helm/gh-bot-orchestrator --version ${{ env.VERSION }} --app-version ${{ env.VERSION }}

      - run: helm push gh-bot-orchestrator-${{ env.VERSION }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
